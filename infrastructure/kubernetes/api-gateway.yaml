apiVersion: apps/v1
kind: Deployment
metadata:
  name: api-gateway
  namespace: distributed-commerce
spec:
  replicas: 2
  selector:
    matchLabels: {app: api-gateway}
  template:
    metadata:
      labels: {app: api-gateway}
    spec:
      containers:
        - name: api-gateway
          image: distributed-commerce/api-gateway:1.0.0
          ports: [{containerPort: 8080}]
          resources:
            requests: {cpu: 100m, memory: 256Mi}
            limits: {cpu: 500m, memory: 512Mi}
          readinessProbe: {httpGet: {path: /actuator/health/readiness, port: 8080}, initialDelaySeconds: 10}
          livenessProbe: {httpGet: {path: /actuator/health/liveness, port: 8080}, initialDelaySeconds: 20}
---
apiVersion: v1
kind: Service
metadata:
  name: api-gateway
  namespace: distributed-commerce
spec:
  selector: {app: api-gateway}
  ports: [{port: 80, targetPort: 8080}]
