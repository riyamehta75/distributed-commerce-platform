server.port: 8085
spring:
  application.name: payment-service
  datasource.url: jdbc:postgresql://postgres:5432/paymentdb
  datasource.username: ${POSTGRES_USER:commerce}
  datasource.password: ${POSTGRES_PASSWORD:commerce}
  jpa.hibernate.ddl-auto: validate
  flyway.enabled: true
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:kafka:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
      acks: all
services:
  order-url: ${ORDER_SERVICE_URL:http://order-service:8084}
internal.api-token: ${INTERNAL_API_TOKEN}
commerce.outbox.poll-interval-ms: ${OUTBOX_POLL_INTERVAL_MS:1000}
management.endpoints.web.exposure.include: health,info,prometheus
