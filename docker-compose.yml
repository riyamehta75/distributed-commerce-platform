x-shared-env: &shared-env
  POSTGRES_USER: ${POSTGRES_USER:-commerce}
  POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-commerce}
  KAFKA_BOOTSTRAP_SERVERS: kafka:9092
services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-commerce}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-commerce}
      POSTGRES_DB: commerce
    ports: ["127.0.0.1:5432:5432"]
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./infrastructure/docker/postgres-init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    healthcheck: {test: ["CMD-SHELL","pg_isready -U $${POSTGRES_USER:-commerce}"], interval: 5s, timeout: 5s, retries: 20}
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports: ["127.0.0.1:6379:6379"]
    healthcheck: {test: ["CMD","redis-cli","ping"], interval: 5s, timeout: 3s, retries: 20}
  kafka:
    image: apache/kafka:3.9.1
    restart: unless-stopped
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_NUM_PARTITIONS: 3
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 >/dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 20
  kafka-init:
    image: apache/kafka:3.9.1
    depends_on: {kafka: {condition: service_healthy}}
    volumes: ["./infrastructure/kafka/topics.txt:/topics.txt:ro"]
    entrypoint: ["/bin/sh", "-c"]
    command: ["while IFS= read -r topic; do [ -z \"$$topic\" ] || /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092 --create --if-not-exists --topic \"$$topic\" --partitions 3 --replication-factor 1; done < /topics.txt"]
    restart: "no"
  kafka-ui:
    image: provectuslabs/kafka-ui:v0.7.2
    restart: unless-stopped
    environment:
      KAFKA_CLUSTERS_0_NAME: local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:9092
    ports: ["127.0.0.1:8088:8080"]
    depends_on: [kafka]
  api-gateway:
    build: ./api-gateway
    restart: unless-stopped
    ports: ["127.0.0.1:8080:8080"]
    environment:
      FRONTEND_ORIGIN: ${FRONTEND_ORIGIN:-http://localhost:3002}
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in .env}
    depends_on: [user-service,product-service,inventory-service,order-service,payment-service,notification-service]
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 20
  user-service:
    build: ./user-service
    restart: unless-stopped
    environment:
      <<: *shared-env
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in .env}
      ADMIN_EMAIL: ${ADMIN_EMAIL:?Set ADMIN_EMAIL in .env}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?Set ADMIN_PASSWORD in .env}
    depends_on: {postgres: {condition: service_healthy}}
  product-service:
    build: ./product-service
    restart: unless-stopped
    environment: *shared-env
    depends_on: {postgres: {condition: service_healthy}, redis: {condition: service_healthy}}
  inventory-service:
    build: ./inventory-service
    restart: unless-stopped
    environment:
      <<: *shared-env
      INTERNAL_API_TOKEN: ${INTERNAL_API_TOKEN:?Set INTERNAL_API_TOKEN in .env}
    depends_on: {postgres: {condition: service_healthy}, kafka: {condition: service_started}}
  order-service:
    build: ./order-service
    restart: unless-stopped
    environment:
      <<: *shared-env
      INTERNAL_API_TOKEN: ${INTERNAL_API_TOKEN:?Set INTERNAL_API_TOKEN in .env}
    depends_on: {postgres: {condition: service_healthy}, kafka-init: {condition: service_completed_successfully}}
  payment-service:
    build: ./payment-service
    restart: unless-stopped
    environment:
      <<: *shared-env
      INTERNAL_API_TOKEN: ${INTERNAL_API_TOKEN:?Set INTERNAL_API_TOKEN in .env}
    depends_on: {postgres: {condition: service_healthy}, kafka-init: {condition: service_completed_successfully}}
  notification-service:
    build: ./notification-service
    restart: unless-stopped
    environment: *shared-env
    depends_on: {postgres: {condition: service_healthy}, kafka-init: {condition: service_completed_successfully}}
  prometheus:
    image: prom/prometheus:v2.54.1
    restart: unless-stopped
    volumes: ["./infrastructure/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro"]
    ports: ["127.0.0.1:9090:9090"]
  grafana:
    image: grafana/grafana:11.2.0
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD:-local-grafana-change-me}
    volumes:
      - ./infrastructure/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./infrastructure/grafana/dashboard.json:/var/lib/grafana/dashboards/commerce.json:ro
    ports: ["127.0.0.1:3001:3000"]
  frontend:
    restart: unless-stopped
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8080}
    ports: ["127.0.0.1:${FRONTEND_PORT:-3002}:3000"]
    depends_on:
      api-gateway: {condition: service_healthy}

volumes:
  postgres_data:
