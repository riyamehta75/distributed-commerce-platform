server:
  port: 8080
jwt.secret: ${JWT_SECRET}
spring:
  application:
    name: api-gateway
  cloud:
    gateway:
      globalcors:
        cors-configurations:
          '[/**]':
            allowedOriginPatterns: "${FRONTEND_ORIGIN:http://localhost:3000}"
            allowedMethods: [GET,POST,PUT,DELETE,OPTIONS]
            allowedHeaders: ["*"]
            allowCredentials: false
      routes:
        - id: users
          uri: ${USER_SERVICE_URL:http://user-service:8081}
          predicates: [Path=/api/users/**]
        - id: products
          uri: ${PRODUCT_SERVICE_URL:http://product-service:8082}
          predicates: [Path=/api/products/**]
        - id: inventory
          uri: ${INVENTORY_SERVICE_URL:http://inventory-service:8083}
          predicates: [Path=/api/inventory/**]
        - id: orders
          uri: ${ORDER_SERVICE_URL:http://order-service:8084}
          predicates: [Path=/api/orders/**]
        - id: payments
          uri: ${PAYMENT_SERVICE_URL:http://payment-service:8085}
          predicates: [Path=/api/payments/**]
        - id: notifications
          uri: ${NOTIFICATION_SERVICE_URL:http://notification-service:8086}
          predicates: [Path=/api/notifications/**]
management:
  endpoints.web.exposure.include: health,info,prometheus
